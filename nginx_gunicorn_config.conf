# Nginx configuration for Aplikasi Input Penjualan with Gunicorn
# Place this in /etc/nginx/sites-available/penjualan-app

upstream penjualan_app {
    server 127.0.0.1:8080;
}

server {
    listen 80;
    server_name localhost;
    
    location / {
        proxy_pass http://penjualan_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    location /static {
        alias /workspace/static;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
    
    location /favicon.ico {
        alias /workspace/static/favicon.ico;
    }
    
    error_log /var/log/nginx/penjualan-app_error.log;
    access_log /var/log/nginx/penjualan-app_access.log;
}