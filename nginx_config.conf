# Nginx configuration for Aplikasi Input Penjualan
# Place this in /etc/nginx/sites-available/penjualan-app

server {
    listen 80;
    server_name localhost;
    
    location / {
        include uwsgi_params;
        uwsgi_pass 127.0.0.1:8080;
    }
    
    location /static {
        alias /workspace/static;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
    
    location /favicon.ico {
        alias /workspace/static/favicon.ico;
    }
    
    error_log /var/log/nginx/penjualan-app_error.log;
    access_log /var/log/nginx/penjualan-app_access.log;
}