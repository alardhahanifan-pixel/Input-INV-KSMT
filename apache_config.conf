# Apache configuration for Aplikasi Input Penjualan
# Place this in /etc/apache2/sites-available/penjualan-app.conf

<VirtualHost *:80>
    ServerName localhost
    DocumentRoot /workspace
    
    WSGIDaemonProcess penjualan-app python-path=/workspace python-home=/usr
    WSGIProcessGroup penjualan-app
    WSGIScriptAlias / /workspace/penjualan_app.wsgi
    
    <Directory /workspace>
        WSGIProcessGroup penjualan-app
        WSGIApplicationGroup %{GLOBAL}
        Require all granted
    </Directory>
    
    ErrorLog ${APACHE_LOG_DIR}/penjualan-app_error.log
    CustomLog ${APACHE_LOG_DIR}/penjualan-app_access.log combined
</VirtualHost>