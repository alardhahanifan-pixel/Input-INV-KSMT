[program:penjualan-app]
command=python3 /workspace/app.py
directory=/workspace
user=ubuntu
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/workspace/logs/penjualan-app.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
environment=FLASK_ENV="production",HOST="0.0.0.0",PORT="8080"